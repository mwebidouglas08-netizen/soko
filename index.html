        <script>
            (function () {
                function showFatal(message) {
                    try {
                        var root = document.getElementById('root');
                        if (root) root.style.display = 'none';
                        var existing = document.getElementById('fatal-boot-error');
                        if (existing) existing.remove();
                        var el = document.createElement('div');
                        el.id = 'fatal-boot-error';
                        el.style.position = 'fixed';
                        el.style.inset = '0';
                        el.style.zIndex = '2147483647';
                        el.style.background = '#0b0f1a';
                        el.style.color = '#fff';
                        el.style.padding = '24px';
                        el.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        el.style.overflow = 'auto';
                        el.innerHTML =
                            '<div style="max-width:900px;margin:0 auto">' +
                            '<h2 style="margin:0 0 12px;font-size:18px;line-height:1.2">App failed to start</h2>' +
                            '<div style="opacity:.85;margin:0 0 12px">A runtime error prevented the app from loading. Copy the error and share it.</div>' +
                            '<pre style="white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:12px;margin:0 0 16px">' +
                            String(message || 'Unknown error').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'})[c]; }) +
                            '</pre>' +
                            '<button id="fatal-boot-reload" style="appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer">Reload</button>' +
                            '</div>';
                        document.body.appendChild(el);
                        var btn = document.getElementById('fatal-boot-reload');
                        if (btn) btn.onclick = function () { location.reload(); };
                    } catch (e) {}
                }
                window.__showFatalError = function (err) {
                    if (window.__appMounted) return;
                    var splash = document.getElementById('boot-splash');
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    var msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
                    showFatal(msg);
                };
                window.addEventListener('error', function (e) {
                    try {
                        var target = e && e.target;
                        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) return;
                    } catch (_) {}
                    if (window.__appMounted || /^(chrome|moz|safari)-extension:/i.test(e.filename || '')) return;
                    var msg = e && e.error ? e.error : e && e.message ? e.message : 'Unknown error';
                    window.__showFatalError(msg);
                });
                window.addEventListener('unhandledrejection', function (e) {
                    if (window.__appMounted) return;
                    var msg = e && e.reason ? e.reason : 'Unhandled promise rejection';
                    window.__showFatalError(msg);
                });
            })();
        </script>
        <style>
            /* ==================================================================
               Intro / initialization screen — v3 "Dark Core HD".

               Dark cinematic start screen with a full-bleed HD background
               image, dark overlay, layered glows, grain, vignette, and a
               pressable brand card. All elements are pointer-interactive
               (subtle parallax / press pulse) without delaying boot.

               Choreography:

                 0.00  shield      1.2s   scale .88 -> 1
                 0.14  aura        0.9s
                 0.26  grid/pulse  1.0s
                 0.40  wordmark    1.10s (longest move; carries frame)
                 0.56  gold rule   0.95s   scaleX .18 -> 1
                 0.72  tagline     0.90s
                 0.86  progress    0.85s
                 0.96  status + %  0.75s
                 1.00  bar fill    4.2s   driven from script, ends 100%
                 1.60  caret blink
                 2.00  bg parallax (continuous)

               Last entrance settles ~1.7s; bar completes 4.2s; splash holds
               ~0.5s then dissolves over 0.85s. Hold enforced in script
               (MIN_VISIBLE), never by animation, so a fast boot never cuts it.
               ================================================================== */
            html, body { margin: 0; min-height: 100%; background: #02040a; }
            body { min-height: 100vh; min-height: 100dvh; }
            #root { min-height: 100vh; min-height: 100dvh; }

            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483000;
                display: grid;
                place-items: center;
                padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                    max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
                box-sizing: border-box;
                overflow: hidden;
                isolation: isolate;
                font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
                color: #e8eefc;
                background:
                    /* Dark overlay over HD image */
                    linear-gradient(180deg, rgba(2, 4, 10, 0.55), rgba(2, 4, 10, 0.85) 55%, rgba(2, 4, 10, 0.95)),
                    radial-gradient(140% 90% at 50% -10%, rgba(99, 102, 241, 0.10), transparent 58%),
                    radial-gradient(110% 100% at 100% 110%, rgba(34, 211, 238, 0.09), transparent 55%),
                    url('/loader.jpg') center/cover no-repeat;
                background-attachment: fixed;
                -webkit-tap-highlight-color: transparent;
                cursor: default;
            }

            /* ---- interactive ambient sky ---- */
            .boot-sky { position: absolute; inset: 0; pointer-events: none; }
            .boot-sky span { position: absolute; inset: 0; }
            .boot-bg-image {
                position: absolute;
                inset: 0;
                background: url('/loader.jpg') center/cover no-repeat;
                opacity: 0.45;
                animation: btBgParallax 20s ease-in-out infinite alternate;
                will-change: transform;
            }
            .boot-glow--teal { background: radial-gradient(56% 44% at 50% 30%, rgba(34, 211, 238, 0.18), transparent 70%); }
            .boot-glow--gold { background: radial-gradient(44% 34% at 82% 88%, rgba(216, 180, 90, 0.14), transparent 72%); }
            .boot-aura {
                background: conic-gradient(from 210deg at 50% 50%, rgba(99, 102, 241, 0.20), rgba(34, 211, 238, 0.16), rgba(129, 140, 248, 0.20), rgba(99, 102, 241, 0.20));
                filter: blur(64px);
                opacity: 0.55;
                animation: btAurora 18s ease-in-out infinite alternate;
                will-change: transform;
            }
            .boot-grid {
                background-image:
                    linear-gradient(rgba(148, 197, 224, 0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 197, 224, 0.06) 1px, transparent 1px);
                background-size: 50px 50px;
                -webkit-mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 76%);
                mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 76%);
            }
            .boot-grain {
                opacity: 0.035;
                background-image: radial-gradient(rgba(255, 255, 255, 0.9) 0.5px, transparent 0.5px);
                background-size: 3px 3px;
            }
            .boot-vignette {
                background:
                    linear-gradient(180deg, rgba(2, 6, 16, 0.6), rgba(2, 6, 16, 0) 28%, rgba(2, 6, 16, 0.8)),
                    radial-gradient(120% 100% at 50% 50%, transparent 54%, rgba(2, 6, 16, 0.6) 100%);
            }

            /* ---- pressable brand card ---- */
            .boot-shell {
                position: relative;
                z-index: 2;
                width: min(92vw, 460px);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                filter: drop-shadow(0 24px 64px rgba(2, 6, 16, 0.55));
            }
            .boot-shell:hover { transform: translateY(-2px); }
            .boot-shell:active { transform: scale(0.975); }

            .boot-mark {
                position: relative;
                width: 92px;
                height: 92px;
                margin: 0 0 22px;
                display: grid;
                place-items: center;
                animation: btMarkIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
                cursor: pointer;
            }
            .boot-mark:hover .boot-mark-core { box-shadow: 0 0 28px rgba(100, 225, 243, 0.95); }
            .boot-mark:active .boot-mark-core { transform: scale(1.25); transition: transform 0.12s ease; }
            .boot-mark-halo {
                position: absolute;
                inset: -26px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(34, 211, 238, 0.16), transparent 66%);
                animation: btHalo 5s ease-in-out infinite;
            }
            .boot-mark-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1px solid rgba(216, 180, 90, 0.5);
                animation: btRingIn 1.2s 0.04s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-ring--inner {
                inset: 14px;
                border-style: dashed;
                border-color: rgba(100, 225, 243, 0.4);
                animation:
                    btRingIn 1.2s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both,
                    bootSpin 22s 1s linear infinite;
            }
            .boot-mark-img {
                position: relative;
                width: 70px;
                height: 70px;
                border-radius: 50%;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.22);
                box-shadow: 0 14px 40px rgba(2, 6, 16, 0.55);
                animation: btDiamondIn 0.95s 0.26s cubic-bezier(0.16, 1, 0.3, 1) both;
                cursor: pointer;
            }
            .boot-mark-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
            .boot-mark-core {
                position: absolute;
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #64e1f3;
                box-shadow: 0 0 20px rgba(100, 225, 243, 0.9);
                animation: bootPulse 3s 0.5s ease-in-out infinite;
            }

            .boot-kicker {
                margin-bottom: 10px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.38em;
                text-transform: uppercase;
                color: #8ab4f8;
                animation: btRise 0.85s 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-brand {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 0.22em;
                line-height: 0.94;
                animation: btTracking 1.12s 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
                cursor: pointer;
            }
            .boot-brand:hover { letter-spacing: -0.005em; transition: letter-spacing 0.25s ease; }
            .boot-brand-main,
            .boot-brand-accent {
                font-size: clamp(2.1rem, 9vw, 3.1rem);
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            .boot-brand-main { color: #ffffff; }
            .boot-brand-accent { color: #d8b45a; }
            .boot-rule {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: min(80%, 300px);
                margin: 16px 0 14px;
                transform-origin: center;
                animation: btRule 0.95s 0.54s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-rule::before, .boot-rule::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(216, 180, 90, 0.55));
            }
            .boot-rule::after { background: linear-gradient(90deg, rgba(216, 180, 90, 0.55), transparent); }
            .boot-rule i {
                width: 6px;
                height: 6px;
                transform: rotate(45deg);
                background: #d8b45a;
                opacity: 0.95;
                box-shadow: 0 0 12px rgba(216, 180, 90, 0.7);
            }
            .boot-tagline {
                margin: 0 0 26px;
                max-width: 32ch;
                font-size: clamp(13px, 2.6vw, 14px);
                line-height: 1.65;
                color: #a7bdd1;
                text-wrap: balance;
                animation: btRise 0.9s 0.66s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* ---- progress ---- */
            .boot-progress {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 12px;
                animation: btRise 0.85s 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-progress-track {
                position: relative;
                display: block;
                width: 100%;
                height: 3px;
                border-radius: 999px;
                background: rgba(148, 197, 224, 0.14);
                overflow: hidden;
            }
            .boot-progress-fill {
                position: relative;
                display: block;
                width: 0;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #d8b45a, #6366f1, #22d3ee);
                background-size: 250% 100%;
                box-shadow: 0 0 16px rgba(34, 211, 238, 0.5);
                transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
                animation: btSheen 2.8s 0.9s linear infinite;
            }
            .boot-progress-meta {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                animation: btRise 0.75s 0.94s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-status {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: #6d8aa3;
                text-align: start;
            }
            .boot-status strong { color: #9fd9e6; font-weight: 700; }
            .boot-pct {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: #9fd9e6;
                font-variant-numeric: tabular-nums;
            }
            .boot-cursor {
                display: inline-block;
                width: 1px;
                height: 1em;
                margin-left: 6px;
                vertical-align: -2px;
                background: #64e1f3;
                animation: bootBlink 1.1s 1.6s steps(2, start) infinite;
            }
            .boot-foot {
                position: absolute;
                z-index: 1;
                inset-inline: 0;
                bottom: max(22px, env(safe-area-inset-bottom));
                text-align: center;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.34em;
                text-transform: uppercase;
                color: rgba(125, 152, 176, 0.65);
                animation: btRise 1s 1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* ---- exit: dissolve, never a jump cut ---- */
            #boot-splash.boot-leaving {
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #boot-splash.boot-leaving .boot-shell {
                transform: scale(1.04);
                opacity: 0;
                transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.7s ease;
            }
            #boot-splash.boot-leaving .boot-foot { opacity: 0; transition: opacity 0.35s ease; }

            /* ---- keyframes ---- */
            @keyframes btMarkIn { from { opacity: 0; transform: scale(0.88) translateY(8px); } to { opacity: 1; transform: none; } }
            @keyframes btRingIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
            @keyframes btHalo { 0%, 100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 0.75; transform: scale(1.12); } }
            @keyframes btDiamondIn { from { opacity: 0; transform: rotate(45deg) scale(0.55); } to { opacity: 1; transform: rotate(45deg) scale(1); } }
            @keyframes btRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
            @keyframes btTracking { from { opacity: 0; letter-spacing: 0.32em; transform: translateY(6px); } to { opacity: 1; letter-spacing: -0.01em; transform: none; } }
            @keyframes btRule { from { opacity: 0; transform: scaleX(0.18); } to { opacity: 1; transform: scaleX(1); } }
            @keyframes btSheen { from { background-position: 180% 50%; } to { background-position: -60% 50%; } }
            @keyframes bootSpin { to { transform: rotate(360deg); } }
            @keyframes bootPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.84); } }
            @keyframes bootBlink { 50% { opacity: 0; } }
            @keyframes btAurora { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 3%, 0) scale(1.06); } }
            @keyframes btBgParallax { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.05) translate3d(10px, -10px, 0); } }
            @keyframes btBgParallax { from { transform: scale(1) translate3d(0, 0, 0); } to { transform: scale(1.05) translate3d(10px, -10px, 0); } }

            /* ---- responsive ---- */
            @media (max-height: 700px) {
                .boot-mark { width: 76px; height: 76px; margin-bottom: 16px; }
                .boot-mark-img { width: 62px; height: 62px; }
                .boot-tagline { margin-bottom: 20px; }
                .boot-foot { display: none; }
            }
            @media (max-width: 420px) {
                .boot-brand-main, .boot-brand-accent { font-size: clamp(1.9rem, 8vw, 2.6rem); }
                .boot-kicker { letter-spacing: 0.28em; }
                .boot-progress-meta { gap: 8px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-mark, .boot-mark-ring, .boot-mark-ring--inner, .boot-mark-img, .boot-mark-core,
                .boot-kicker, .boot-brand, .boot-rule, .boot-tagline, .boot-progress, .boot-progress-meta,
                .boot-progress-fill, .boot-cursor, .boot-foot, .boot-halo, .boot-aura { animation: none !important; }
                .boot-progress-fill { width: 100% !important; transition: none !important; }
                .boot-mark:hover, .boot-shell:hover { transform: none; }
                #boot-splash.boot-leaving, #boot-splash.boot-leaving .boot-shell { transition: none !important; }
            }
        </style>

    </head>
    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        
        <div id="boot-splash" role="status" aria-label="Opening TradingHubs">
            <div class="boot-sky" aria-hidden="true">
                <span class="boot-bg-image"></span>
                <span class="boot-glow--teal"></span>
                <span class="boot-glow--gold"></span>
                <span class="boot-aura"></span>
                <span class="boot-grid"></span>
                <span class="boot-grain"></span>
                <span class="boot-vignette"></span>
            </div>
            <div class="boot-shell">
                <div class="boot-mark" role="button" tabindex="0" aria-label="TradingHubs mark">
                    <span class="boot-mark-halo"></span>
                    <span class="boot-mark-ring"></span>
                    <span class="boot-mark-ring boot-mark-ring--inner"></span>
                    <div class="boot-mark-img"><img src="/assets/tradinghubs-mark.svg" alt="" aria-hidden="true"/></div>
                    <span class="boot-mark-core"></span>
                </div>
                <div class="boot-kicker">Precision Trading Workspace</div>
                <div class="boot-brand" role="button" tabindex="0" aria-label="TradingHubs">
                    <span class="boot-brand-main">TRADING</span><span class="boot-brand-accent">HUBS</span>
                </div>
                <div class="boot-rule" aria-hidden="true"><i></i></div>
                <p class="boot-tagline">Build, automate, and run trading strategies with cinematic clarity.</p>
                <div class="boot-progress">
                    <span class="boot-progress-track" aria-hidden="true">
                        <span class="boot-progress-fill" id="bt-fill"></span>
                    </span>
                    <span class="boot-progress-meta">
                        <span class="boot-status">Initializing <strong id="bt-status">Core systems</strong><span class="boot-cursor" aria-hidden="true"></span></span>
                        <span class="boot-pct" id="bt-pct">0%</span>
                    </span>
                </div>
            </div>
            <div class="boot-foot" aria-hidden="true">tradinghubs.site</div>
        </div>

        <script>
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;

                var perf = window.performance && typeof window.performance.now === 'function' ? window.performance : null;
                var now = function () { return perf ? perf.now() : Date.now(); };
                var started = now();

                var reduce = false;
                try {
                    reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
                } catch (e) {
                    reduce = false;
                }

                /* The bar reaches 100% at INTRO_MS, the splash holds for HOLD_MS
                   and then dissolves over FADE_MS. MIN_VISIBLE is a hard floor:
                   nothing â€” not main.tsx, not the React shell â€” can dismiss the
                   intro before it, which is what used to make it flash past. */
                var INTRO_MS = reduce ? 700 : 4200;
                var HOLD_MS = reduce ? 150 : 520;
                var FADE_MS = reduce ? 0 : 850;
                var MIN_VISIBLE = INTRO_MS + HOLD_MS;

                var fill = document.getElementById('bt-fill');
                var pct = document.getElementById('bt-pct');
                var status = document.getElementById('bt-status');
                var LINES = ['Core systems', 'Market data', 'Trading engines', 'AI workspace', 'Final checks'];
                var shown = -1;

                function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

                function paint() {
                    var raw = (now() - started) / INTRO_MS;
                    var p = raw > 1 ? 1 : raw < 0 ? 0 : raw;
                    var eased = easeOut(p);
                    var value = Math.round(eased * 100);
                    if (fill) fill.style.width = value + '%';
                    if (pct) pct.textContent = value + '%';
                    var idx = Math.min(LINES.length - 1, Math.floor(eased * LINES.length));
                    if (status && idx !== shown) { status.textContent = LINES[idx]; shown = idx; }
                    if (p < 1) requestAnimationFrame(paint);
                }

                if (!reduce && typeof requestAnimationFrame === 'function') {
                    requestAnimationFrame(paint);
                } else {
                    if (fill) fill.style.width = '100%';
                    if (pct) pct.textContent = '100%';
                    if (status) status.textContent = LINES[LINES.length - 1];
                }

                var leaving = false;
                var removed = false;

                function drop() {
                    removed = true;
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                }

                /* Public hook. Callers may request the dissolve at any time; the
                   intro defers until its minimum on-screen time has elapsed and
                   then plays the exit, so a fast boot reveals a finished intro
                   instead of cutting it off mid-entrance. */
                function hide() {
                    if (leaving || removed) return;
                    var elapsed = now() - started;
                    if (elapsed < MIN_VISIBLE) { setTimeout(hide, Math.max(32, MIN_VISIBLE - elapsed)); return; }
                    leaving = true;
                    if (fill) fill.style.width = '100%';
                    if (pct) pct.textContent = '100%';
                    if (!FADE_MS) { drop(); return; }
                    splash.className += ' boot-leaving';
                    setTimeout(drop, FADE_MS + 90);
                }

                window.__hideBootSplash = hide;

                /* Safety net: never trap the user behind the intro if the bundle
                   dies before it calls the hook. */
                setTimeout(hide, 15000);
            })();
        </script>
    </body>
</html>
