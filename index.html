        <title>TradingHubs</title>
        <script>
            (function () {
                function showFatal(message) {
                    try {
                        var root = document.getElementById('root');
                        if (root) root.style.display = 'none';
                        var existing = document.getElementById('fatal-boot-error');
                        if (existing) existing.remove();
                        var el = document.createElement('div');
                        el.id = 'fatal-boot-error';
                        el.style.position = 'fixed';
                        el.style.inset = '0';
                        el.style.zIndex = '2147483647';
                        el.style.background = '#0b0f1a';
                        el.style.color = '#fff';
                        el.style.padding = '24px';
                        el.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        el.style.overflow = 'auto';
                        el.innerHTML =
                            '<div style="max-width:900px;margin:0 auto">' +
                            '<h2 style="margin:0 0 12px;font-size:18px;line-height:1.2">App failed to start</h2>' +
                            '<div style="opacity:.85;margin:0 0 12px">A runtime error prevented the app from loading. Copy the error and share it.</div>' +
                            '<pre style="white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:12px;margin:0 0 16px">' +
                            String(message || 'Unknown error') +
                            '</pre>' +
                            '<button id="fatal-boot-reload" style="appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer">Reload</button>' +
                            '</div>';
                        document.body.appendChild(el);
                        var btn = document.getElementById('fatal-boot-reload');
                        if (btn) btn.onclick = function () { location.reload(); };
                    } catch (e) {}
                }
                window.__showFatalError = function (err) {
                    var splash = document.getElementById('boot-splash');
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    var msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
                    showFatal(msg);
                };
                window.addEventListener('error', function (e) {
                    try {
                        var target = e && e.target;
                        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) return;
                    } catch (_) {}
                    var msg = e && e.error ? e.error : e && e.message ? e.message : 'Unknown error';
                    window.__showFatalError(msg);
                });
                window.addEventListener('unhandledrejection', function (e) {
                    var msg = e && e.reason ? e.reason : 'Unhandled promise rejection';
                    window.__showFatalError(msg);
                });
            })();
        </script>
        <style>
            html, body {
                margin: 0;
                min-height: 100%;
                background: #030712;
            }
            body { min-height: 100vh; }
            #root { min-height: 100vh; }

            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                box-sizing: border-box;
                overflow: hidden;
                font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
                color: #f8fafc;
                background:
                    radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.35), transparent 60%),
                    radial-gradient(900px 500px at 110% 110%, rgba(34,211,238,0.22), transparent 55%),
                    linear-gradient(180deg, rgba(2,6,23,0.55), rgba(2,6,23,0.82)),
                    url('/loader.jpg') center/cover no-repeat fixed;
                isolation: isolate;
            }
            #boot-splash::before {
                content: '';
                position: absolute;
                inset: -20%;
                background:
                    conic-gradient(from 180deg at 50% 50%, rgba(99,102,241,0.18), rgba(34,211,238,0.12), rgba(99,102,241,0.18));
                filter: blur(60px);
                opacity: 0.55;
                animation: bootAurora 14s ease-in-out infinite alternate;
                z-index: 0;
            }
            #boot-splash::after {
                content: '';
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(to bottom, rgba(3,7,18,0.15) 0%, rgba(3,7,18,0.35) 45%, rgba(3,7,18,0.75) 100%),
                    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.06), transparent 45%);
                pointer-events: none;
                z-index: 0;
            }
            .boot-grain {
                position: absolute;
                inset: 0;
                opacity: 0.05;
                background-image: radial-gradient(rgba(255,255,255,0.7) 0.5px, transparent 0.5px);
                background-size: 3px 3px;
                mix-blend-mode: soft-light;
                pointer-events: none;
                z-index: 0;
            }
            .boot-shell {
                position: relative;
                z-index: 1;
                width: min(92vw, 640px);
                text-align: center;
                padding: clamp(20px, 4vw, 36px) clamp(16px, 3vw, 28px);
                border-radius: 28px;
                background: linear-gradient(180deg, rgba(15,23,42,0.28), rgba(15,23,42,0.12));
                border: 1px solid rgba(255,255,255,0.12);
                box-shadow: 0 30px 80px rgba(2,6,23,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
                backdrop-filter: blur(18px) saturate(140%);
                -webkit-backdrop-filter: blur(18px) saturate(140%);
                animation: bootRise 0.9s cubic-bezier(0.22,1,0.36,1) both;
            }
            .boot-logo-wrap {
                position: relative;
                width: clamp(64px, 16vw, 88px);
                height: clamp(64px, 16vw, 88px);
                margin: 0 auto 18px;
            }
            .boot-ring, .boot-ring-inner {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1px solid rgba(99,102,241,0.55);
                box-shadow: 0 0 24px rgba(99,102,241,0.25);
                animation: bootSpin 18s linear infinite;
            }
            .boot-ring-inner {
                inset: 7px;
                border-color: rgba(34,211,238,0.45);
                box-shadow: 0 0 20px rgba(34,211,238,0.2);
                animation-direction: reverse;
                animation-duration: 14s;
            }
            .boot-logo {
                position: absolute;
                inset: 12px;
                width: calc(100% - 24px);
                height: calc(100% - 24px);
                border-radius: 50%;
                object-fit: cover;
                border: 1px solid rgba(255,255,255,0.18);
                box-shadow: 0 10px 30px rgba(2,6,23,0.45);
                animation: bootPulse 4.5s ease-in-out infinite;
            }
            .boot-brand {
                display: flex;
                justify-content: center;
                align-items: baseline;
                gap: 0.35em;
                flex-wrap: wrap;
                margin-bottom: 10px;
                letter-spacing: -0.03em;
                line-height: 0.95;
            }
            .boot-brand-main {
                font-size: clamp(2.2rem, 8vw, 4.6rem);
                font-weight: 900;
                background: linear-gradient(135deg, #818cf8 0%, #6366f1 45%, #22d3ee 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                filter: drop-shadow(0 0 18px rgba(99,102,241,0.25));
            }
            .boot-brand-accent {
                font-size: clamp(2.2rem, 8vw, 4.6rem);
                font-weight: 900;
                color: #e0f2fe;
                text-shadow: 0 0 22px rgba(34,211,238,0.25);
            }
            .boot-kicker {
                font-size: 0.72rem;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                color: #c7d2fe;
                font-weight: 700;
                margin-bottom: 8px;
            }
            .boot-tagline {
                font-size: clamp(1.05rem, 2.8vw, 1.55rem);
                line-height: 1.35;
                color: #f8fafc;
                font-weight: 600;
                max-width: 28ch;
                margin: 0 auto 22px;
                text-wrap: balance;
            }
            .boot-progress {
                width: min(100%, 420px);
                height: 6px;
                margin: 0 auto 10px;
                border-radius: 999px;
                background: rgba(255,255,255,0.08);
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.08);
            }
            .boot-progress-fill {
                height: 100%;
                width: 35%;
                border-radius: inherit;
                background: linear-gradient(90deg, #6366f1, #22d3ee, #818cf8);
                background-size: 200% 100%;
                box-shadow: 0 0 18px rgba(99,102,241,0.45);
                animation: bootLoad 2.2s ease-in-out infinite, bootShimmer 3s linear infinite;
            }
            .boot-status {
                font-size: 0.78rem;
                color: #94a3b8;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                font-weight: 700;
            }
            .boot-status strong {
                color: #67e8f9;
                text-transform: none;
                letter-spacing: 0.02em;
                font-weight: 700;
            }
            #boot-splash.boot-splash--out {
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.5s ease, visibility 0.5s ease;
            }

            @keyframes bootRise { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
            @keyframes bootAurora { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 2%, 0) scale(1.08); } }
            @keyframes bootSpin { to { transform: rotate(360deg); } }
            @keyframes bootPulse { 0%,100% { transform: scale(1); box-shadow: 0 10px 30px rgba(2,6,23,0.45); } 50% { transform: scale(1.03); box-shadow: 0 14px 36px rgba(99,102,241,0.25); } }
            @keyframes bootLoad { 0% { transform: translateX(-120%); } 50% { transform: translateX(10%); } 100% { transform: translateX(220%); } }
            @keyframes bootShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

            @media (max-height: 700px) {
                .boot-shell { padding: 18px 16px; border-radius: 22px; }
                .boot-tagline { margin-bottom: 16px; }
                .boot-logo-wrap { margin-bottom: 12px; }
            }
            @media (max-width: 420px) {
                .boot-shell { width: 100%; border-radius: 22px; }
                .boot-kicker { letter-spacing: 0.2em; }
            }
            @media (prefers-reduced-motion: reduce) {
                #boot-splash *, #boot-splash::before { animation: none !important; transition: none !important; }
                .boot-progress-fill { transform: none; width: 45%; }
            }
        </style>
    </head>
    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        <div id="boot-splash" role="status" aria-label="Loading TradingHubs">
            <div class="boot-grain" aria-hidden="true"></div>
            <div class="boot-shell">
                <div class="boot-logo-wrap">
                    <div class="boot-ring"></div>
                    <div class="boot-ring-inner"></div>
                    <img class="boot-logo" src="/loader.jpg" alt="" />
                </div>
                <div class="boot-kicker">Precision Trading Workspace</div>
                <div class="boot-brand" aria-label="TradingHubs">
                    <span class="boot-brand-main">TRADING</span>
                    <span class="boot-brand-accent">HUBS</span>
                </div>
                <p class="boot-tagline">Build, automate, and run trading strategies with clarity and confidence.</p>
                <div class="boot-progress" aria-hidden="true"><div class="boot-progress-fill"></div></div>
                <div class="boot-status">Initializing <strong id="bt-boot-status-text">Core</strong></div>
            </div>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;
                var hidden = false;
                var hide = function () {
                    if (hidden) return;
                    hidden = true;
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                };
                window.__hideBootSplash = hide;
                var lines = ['Core', 'Trading engines', 'Market data', 'AI workspace', 'Final checks'];
                var idx = 0;
                var el = document.getElementById('bt-boot-status-text');
                if (el) {
                    setInterval(function () {
                        if (hidden) return;
                        idx = (idx + 1) % lines.length;
                        el.textContent = lines[idx];
                    }, 1400);
                }
                setTimeout(hide, 60000);
            })();
        </script>
    </body>
</html>
