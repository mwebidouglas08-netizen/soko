<svg width="228" height="54" viewBox="0 0 228 54" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001840;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#010d21;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001840;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="derivStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF3B3B;stop-opacity:0" />
      <stop offset="55%" style="stop-color:#FF3B3B;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#FF3B3B;stop-opacity:0" />
    </linearGradient>
    <filter id="barGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="derivGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#barGlow)">
    <rect x="0" y="22" width="6" height="13" rx="3" fill="url(#barGrad)" />
    <rect x="9" y="14" width="6" height="21" rx="3" fill="url(#barGrad)" />
    <rect x="18" y="5" width="6" height="30" rx="3" fill="url(#barGrad)" />
  </g>
  <text x="34" y="29" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="url(#textGrad)" letter-spacing="0">traderscheme</text>
  <text x="34" y="44" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="rgba(255,255,255,0.45)" letter-spacing="0.3">powered by <tspan font-weight="800" fill="#FF3B3B" filter="url(#derivGlow)">deriv</tspan></text>
  <rect x="34" y="49" width="194" height="1.4" fill="url(#derivStreak)" />
</svg>