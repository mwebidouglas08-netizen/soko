        <script>
            (function () {
                function showFatal(message) {
                    try {
                        var root = document.getElementById('root');
                        if (root) root.style.display = 'none';
                        var existing = document.getElementById('fatal-boot-error');
                        if (existing) existing.remove();
                        var el = document.createElement('div');
                        el.id = 'fatal-boot-error';
                        el.style.position = 'fixed';
                        el.style.inset = '0';
                        el.style.zIndex = '2147483647';
                        el.style.background = '#0b0f1a';
                        el.style.color = '#fff';
                        el.style.padding = '24px';
                        el.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        el.style.overflow = 'auto';
                        el.innerHTML =
                            '<div style="max-width:900px;margin:0 auto">' +
                            '<h2 style="margin:0 0 12px;font-size:18px;line-height:1.2">App failed to start</h2>' +
                            '<div style="opacity:.85;margin:0 0 12px">A runtime error prevented the app from loading. Copy the error and share it.</div>' +
                            '<pre style="white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:12px;margin:0 0 16px">' +
                            String(message || 'Unknown error') +
                            '</pre>' +
                            '<button id="fatal-boot-reload" style="appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer">Reload</button>' +
                            '</div>';
                        document.body.appendChild(el);
                        var btn = document.getElementById('fatal-boot-reload');
                        if (btn) btn.onclick = function () { location.reload(); };
                    } catch (e) {}
                }
                window.__showFatalError = function (err) {
                    var splash = document.getElementById('boot-splash');
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    var msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
                    showFatal(msg);
                };
                window.addEventListener('error', function (e) {
                    try {
                        var target = e && e.target;
                        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) return;
                    } catch (_) {}
                    var msg = e && e.error ? e.error : e && e.message ? e.message : 'Unknown error';
                    window.__showFatalError(msg);
                });
                window.addEventListener('unhandledrejection', function (e) {
                    var msg = e && e.reason ? e.reason : 'Unhandled promise rejection';
                    window.__showFatalError(msg);
                });
            })();
        </script>
        <style>
            /* ==================================================================
               Intro / initialization screen.

               Painted by the browser on the very first frame — no bundle, no
               webfonts, no photographs and no large blur filters, so it appears
               instantly even on a cold, mid-range phone. Depth comes from
               layered radial gradients (cheap) plus border-only shapes.

               Choreography (delay / duration, expo-out, so each element
               decelerates into place while the next is still travelling):

                 0.00  mark        1.10s   scale .92 -> 1
                 0.28  kicker      0.85s
                 0.40  wordmark    1.15s   the longest move; carries the frame
                 0.58  gold rule   0.95s   scaleX .18 -> 1, drawn outward
                 0.70  tagline     0.90s
                 0.84  progress    0.85s
                 0.96  status + %  0.75s
                 1.00  bar fill    4.20s   driven from script, ends at 100%
                 1.60  caret blink (delayed so it never blinks on an empty line)

               The last entrance settles at ~1.7s, the bar completes at 4.2s,
               the splash holds ~0.5s and then dissolves over 0.85s. That hold is
               enforced in script (MIN_VISIBLE), never by the animation, so a
               fast boot cannot make the intro flash past.
               ================================================================== */
            html,
            body { margin: 0; min-height: 100%; background: #040b16; }
            body { min-height: 100vh; min-height: 100dvh; }
            #root { min-height: 100vh; min-height: 100dvh; }

            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483000;
                display: grid;
                place-items: center;
                padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                    max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
                box-sizing: border-box;
                overflow: hidden;
                isolation: isolate;
                font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
                color: #e8eefc;
                background:
                    radial-gradient(120% 78% at 50% -12%, #0d3b4a 0%, #061420 46%, #040b16 76%),
                    #040b16;
                -webkit-tap-highlight-color: transparent;
            }

            .boot-sky,
            .boot-sky span { position: absolute; inset: 0; pointer-events: none; }
            .boot-glow--teal { background: radial-gradient(52% 38% at 50% 34%, rgba(100, 225, 243, 0.16), transparent 72%); }
            .boot-glow--gold { background: radial-gradient(40% 30% at 78% 84%, rgba(216, 180, 90, 0.12), transparent 74%); }
            .boot-grid {
                background-image:
                    linear-gradient(rgba(148, 197, 224, 0.055) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 197, 224, 0.055) 1px, transparent 1px);
                background-size: 46px 46px;
                -webkit-mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 78%);
                mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 78%);
            }
            .boot-grain {
                opacity: 0.035;
                background-image: radial-gradient(rgba(255, 255, 255, 0.9) 0.5px, transparent 0.5px);
                background-size: 3px 3px;
            }
            .boot-vignette {
                background:
                    linear-gradient(180deg, rgba(2, 6, 16, 0.5), rgba(2, 6, 16, 0) 26%, rgba(2, 6, 16, 0.72)),
                    radial-gradient(120% 100% at 50% 50%, transparent 52%, rgba(2, 6, 16, 0.55) 100%);
            }

            .boot-shell {
                position: relative;
                z-index: 1;
                width: min(88vw, 430px);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .boot-mark {
                position: relative;
                width: 88px;
                height: 88px;
                margin: 0 0 24px;
                display: grid;
                place-items: center;
                animation: btMarkIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-halo {
                position: absolute;
                inset: -22px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(100, 225, 243, 0.14), transparent 68%);
            }
            .boot-mark-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1px solid rgba(216, 180, 90, 0.45);
                animation: btRingIn 1.2s 0.05s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-ring--inner {
                inset: 12px;
                border-style: dashed;
                border-color: rgba(100, 225, 243, 0.38);
                animation:
                    btRingIn 1.2s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both,
                    bootSpin 26s 1s linear infinite;
            }
            .boot-mark-diamond {
                position: absolute;
                width: 26px;
                height: 26px;
                border: 1px solid rgba(216, 180, 90, 0.85);
                transform: rotate(45deg);
                box-shadow: 0 0 18px rgba(216, 180, 90, 0.3);
                animation: btDiamondIn 0.95s 0.26s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-core {
                position: absolute;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #64e1f3;
                box-shadow: 0 0 16px rgba(100, 225, 243, 0.85);
                animation: bootPulse 2.8s 0.5s ease-in-out infinite;
            }

            .boot-kicker {
                margin-bottom: 12px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.34em;
                text-transform: uppercase;
                color: #7fa3bd;
                animation: btRise 0.85s 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-brand {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 0.24em;
                line-height: 0.95;
                animation: btTracking 1.15s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-brand-main,
            .boot-brand-accent {
                font-size: clamp(2rem, 8.5vw, 2.9rem);
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            .boot-brand-main { color: #ffffff; }
            .boot-brand-accent { color: #d8b45a; }
            .boot-rule {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: min(76%, 260px);
                margin: 16px 0 14px;
                transform-origin: center;
                animation: btRule 0.95s 0.58s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-rule::before,
            .boot-rule::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(216, 180, 90, 0.5));
            }
            .boot-rule::after { background: linear-gradient(90deg, rgba(216, 180, 90, 0.5), transparent); }
            .boot-rule i {
                width: 5px;
                height: 5px;
                transform: rotate(45deg);
                background: #d8b45a;
                opacity: 0.9;
            }
            .boot-tagline {
                margin: 0 0 28px;
                max-width: 30ch;
                font-size: 13px;
                line-height: 1.6;
                color: #a7bdd1;
                text-wrap: balance;
                animation: btRise 0.9s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .boot-progress {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 11px;
                animation: btRise 0.85s 0.84s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-progress-track {
                position: relative;
                display: block;
                width: 100%;
                height: 2px;
                border-radius: 999px;
                background: rgba(148, 197, 224, 0.16);
                overflow: hidden;
            }
            .boot-progress-fill {
                position: relative;
                display: block;
                width: 0;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, #d8b45a, #64e1f3);
                background-size: 200% 100%;
                box-shadow: 0 0 12px rgba(100, 225, 243, 0.45);
                transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
                animation: btSheen 2.6s 1s linear infinite;
            }
            .boot-progress-meta {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                animation: btRise 0.75s 0.96s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-status {
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: #6d8aa3;
                text-align: start;
            }
            .boot-status strong { color: #9fd9e6; font-weight: 700; }
            .boot-pct {
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: #9fd9e6;
                font-variant-numeric: tabular-nums;
            }
            .boot-cursor {
                display: inline-block;
                width: 1px;
                height: 1em;
                margin-left: 6px;
                vertical-align: -2px;
                background: #64e1f3;
                animation: bootBlink 1.1s 1.6s steps(2, start) infinite;
            }
            .boot-foot {
                position: absolute;
                z-index: 1;
                inset-inline: 0;
                bottom: max(22px, env(safe-area-inset-bottom));
                text-align: center;
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                color: rgba(125, 152, 176, 0.6);
                animation: btRise 1s 1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* Exit: dissolve, never a jump cut. */
            #boot-splash.boot-leaving {
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #boot-splash.boot-leaving .boot-shell {
                transform: scale(1.035);
                opacity: 0;
                transition:
                    transform 0.85s cubic-bezier(0.4, 0, 0.2, 1),
                    opacity 0.7s ease;
            }
            #boot-splash.boot-leaving .boot-foot { opacity: 0; transition: opacity 0.35s ease; }

            @keyframes btMarkIn { from { opacity: 0; transform: scale(0.9) translateY(8px); } to { opacity: 1; transform: none; } }
            @keyframes btRingIn { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
            @keyframes btDiamondIn { from { opacity: 0; transform: rotate(45deg) scale(0.5); } to { opacity: 1; transform: rotate(45deg) scale(1); } }
            @keyframes btRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
            @keyframes btTracking { from { opacity: 0; letter-spacing: 0.3em; transform: translateY(6px); } to { opacity: 1; letter-spacing: -0.01em; transform: none; } }
            @keyframes btRule { from { opacity: 0; transform: scaleX(0.18); } to { opacity: 1; transform: scaleX(1); } }
            @keyframes btSheen { from { background-position: 160% 50%; } to { background-position: -60% 50%; } }
            @keyframes bootSpin { to { transform: rotate(360deg); } }
            @keyframes bootPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.82); } }
            @keyframes bootBlink { 50% { opacity: 0; } }

            @media (max-height: 700px) {
                .boot-mark { width: 72px; height: 72px; margin-bottom: 18px; }
                .boot-tagline { margin-bottom: 22px; }
                .boot-foot { display: none; }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot-mark,
                .boot-mark-ring,
                .boot-mark-ring--inner,
                .boot-mark-diamond,
                .boot-mark-core,
                .boot-kicker,
                .boot-brand,
                .boot-rule,
                .boot-tagline,
                .boot-progress,
                .boot-progress-meta,
                .boot-progress-fill,
                .boot-cursor,
                .boot-foot { animation: none !important; }
                .boot-progress-fill { width: 100% !important; transition: none !important; }
                #boot-splash.boot-leaving,
                #boot-splash.boot-leaving .boot-shell { transition: none !important; }
            }
        </style>

    </head>
    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        
        <div id="boot-splash" role="status" aria-label="Opening TradingHubs">
            <div class="boot-sky" aria-hidden="true">
                <span class="boot-glow--teal"></span>
                <span class="boot-glow--gold"></span>
                <span class="boot-grid"></span>
                <span class="boot-grain"></span>
                <span class="boot-vignette"></span>
            </div>
            <div class="boot-shell">
                <div class="boot-mark" aria-hidden="true">
                    <span class="boot-mark-halo"></span>
                    <span class="boot-mark-ring"></span>
                    <span class="boot-mark-ring boot-mark-ring--inner"></span>
                    <span class="boot-mark-diamond"></span>
                    <span class="boot-mark-core"></span>
                </div>
                <div class="boot-kicker">Precision Trading Workspace</div>
                <div class="boot-brand" aria-label="TradingHubs">
                    <span class="boot-brand-main">TRADING</span><span class="boot-brand-accent">HUBS</span>
                </div>
                <div class="boot-rule" aria-hidden="true"><i></i></div>
                <p class="boot-tagline">Build, automate and run trading strategies with clarity and confidence.</p>
                <div class="boot-progress">
                    <span class="boot-progress-track" aria-hidden="true">
                        <span class="boot-progress-fill" id="bt-fill"></span>
                    </span>
                    <span class="boot-progress-meta">
                        <span class="boot-status">Initializing <strong id="bt-status">Core systems</strong><span class="boot-cursor" aria-hidden="true"></span></span>
                        <span class="boot-pct" id="bt-pct">0%</span>
                    </span>
                </div>
            </div>
            <div class="boot-foot" aria-hidden="true">tradinghubs.site</div>
        </div>

        <script>
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;

                var perf = window.performance && typeof window.performance.now === 'function' ? window.performance : null;
                var now = function () { return perf ? perf.now() : Date.now(); };
                var started = now();

                var reduce = false;
                try {
                    reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
                } catch (e) {
                    reduce = false;
                }

                /* The bar reaches 100% at INTRO_MS, the splash holds for HOLD_MS
                   and then dissolves over FADE_MS. MIN_VISIBLE is a hard floor:
                   nothing — not main.tsx, not the React shell — can dismiss the
                   intro before it, which is what used to make it flash past. */
                var INTRO_MS = reduce ? 700 : 4200;
                var HOLD_MS = reduce ? 150 : 520;
                var FADE_MS = reduce ? 0 : 850;
                var MIN_VISIBLE = INTRO_MS + HOLD_MS;

                var fill = document.getElementById('bt-fill');
                var pct = document.getElementById('bt-pct');
                var status = document.getElementById('bt-status');
                var LINES = ['Core systems', 'Market data', 'Trading engines', 'AI workspace', 'Final checks'];
                var shown = -1;

                function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

                function paint() {
                    var raw = (now() - started) / INTRO_MS;
                    var p = raw > 1 ? 1 : raw < 0 ? 0 : raw;
                    var eased = easeOut(p);
                    var value = Math.round(eased * 100);
                    if (fill) fill.style.width = value + '%';
                    if (pct) pct.textContent = value + '%';
                    var idx = Math.min(LINES.length - 1, Math.floor(eased * LINES.length));
                    if (status && idx !== shown) { status.textContent = LINES[idx]; shown = idx; }
                    if (p < 1) requestAnimationFrame(paint);
                }

                if (!reduce && typeof requestAnimationFrame === 'function') {
                    requestAnimationFrame(paint);
                } else {
                    if (fill) fill.style.width = '100%';
                    if (pct) pct.textContent = '100%';
                    if (status) status.textContent = LINES[LINES.length - 1];
                }

                var leaving = false;
                var removed = false;

                function drop() {
                    removed = true;
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                }

                /* Public hook. Callers may request the dissolve at any time; the
                   intro defers until its minimum on-screen time has elapsed and
                   then plays the exit, so a fast boot reveals a finished intro
                   instead of cutting it off mid-entrance. */
                function hide() {
                    if (leaving || removed) return;
                    var elapsed = now() - started;
                    if (elapsed < MIN_VISIBLE) { setTimeout(hide, Math.max(32, MIN_VISIBLE - elapsed)); return; }
                    leaving = true;
                    if (fill) fill.style.width = '100%';
                    if (pct) pct.textContent = '100%';
                    if (!FADE_MS) { drop(); return; }
                    splash.className += ' boot-leaving';
                    setTimeout(drop, FADE_MS + 90);
                }

                window.__hideBootSplash = hide;

                /* Safety net: never trap the user behind the intro if the bundle
                   dies before it calls the hook. */
                setTimeout(hide, 15000);
            })();
        </script>
    </body>
</html>
