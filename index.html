        <title>TradingHubs</title>
        <script>
            (function () {
                function showFatal(message) {
                    try {
                        var root = document.getElementById('root');
                        if (root) root.style.display = 'none';
                        var existing = document.getElementById('fatal-boot-error');
                        if (existing) existing.remove();
                        var el = document.createElement('div');
                        el.id = 'fatal-boot-error';
                        el.style.position = 'fixed';
                        el.style.inset = '0';
                        el.style.zIndex = '2147483647';
                        el.style.background = '#0b0f1a';
                        el.style.color = '#fff';
                        el.style.padding = '24px';
                        el.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        el.style.overflow = 'auto';
                        el.innerHTML =
                            '<div style="max-width:900px;margin:0 auto">' +
                            '<h2 style="margin:0 0 12px;font-size:18px;line-height:1.2">App failed to start</h2>' +
                            '<div style="opacity:.85;margin:0 0 12px">A runtime error prevented the app from loading. Copy the error and share it.</div>' +
                            '<pre style="white-space:pre-wrap;word-break:break-word;background:#111827;border:1px solid rgba(255,255,255,.12);padding:12px;border-radius:12px;margin:0 0 16px">' +
                            String(message || 'Unknown error') +
                            '</pre>' +
                            '<button id="fatal-boot-reload" style="appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer">Reload</button>' +
                            '</div>';
                        document.body.appendChild(el);
                        var btn = document.getElementById('fatal-boot-reload');
                        if (btn) btn.onclick = function () { location.reload(); };
                    } catch (e) {}
                }
                window.__showFatalError = function (err) {
                    var splash = document.getElementById('boot-splash');
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    var msg = err && (err.stack || err.message) ? (err.stack || err.message) : String(err);
                    showFatal(msg);
                };
                window.addEventListener('error', function (e) {
                    try {
                        var target = e && e.target;
                        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) return;
                    } catch (_) {}
                    var msg = e && e.error ? e.error : e && e.message ? e.message : 'Unknown error';
                    window.__showFatalError(msg);
                });
                window.addEventListener('unhandledrejection', function (e) {
                    var msg = e && e.reason ? e.reason : 'Unhandled promise rejection';
                    window.__showFatalError(msg);
                });
            })();
        </script>
        <style>
            /* ------------------------------------------------------------------
               Initialization screen — first paint, before the bundle evaluates.
               No photographs and no large blurred filters: it must render in the
               first frame on a mid-range phone. Depth is layered radial gradients
               plus border-only shapes. Palette is the hub shell's own — navy
               #040b16, teal #64e1f3, warm gold #d8b45a.

               Choreography — delay / duration, expo-out easing so each element
               decelerates into place while the next one is still travelling:

                 0.00  emblem      1.10s   scale .92 -> 1
                 0.30  kicker      0.85s
                 0.42  wordmark    1.05s   the longest move, carries the frame
                 0.60  gold rule   0.95s   scaleX .18 -> 1, drawn outward
                 0.72  tagline     0.90s
                 0.88  progress    0.85s
                 1.02  status      0.75s
                 1.05  bar fill    3.00s   eases to 92% and holds -> 4.05s
                 1.60  caret blink (delayed so it never blinks into an empty line)

               Last entrance settles at 1.77s, the bar completes at 4.05s: the
               whole sequence finishes inside five seconds with the exit fade
               (0.45s) on top.
               ------------------------------------------------------------------ */
            html, body { margin: 0; min-height: 100%; background: #040b16; }
            body { min-height: 100vh; min-height: 100dvh; }
            #root { min-height: 100vh; min-height: 100dvh; }

            #boot-splash {
                position: fixed;
                inset: 0;
                z-index: 2147483000;
                display: grid;
                place-items: center;
                padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
                box-sizing: border-box;
                overflow: hidden;
                isolation: isolate;
                font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
                color: #e8eefc;
                background:
                    radial-gradient(120% 78% at 50% -12%, #0d3b4a 0%, #061420 46%, #040b16 76%),
                    #040b16;
            }
            /* Exit. The hide() hook adds this class and removes the node 460ms
               later, so the splash dissolves and pushes through to the app
               instead of vanishing between frames. */
            #boot-splash.boot-leaving {
                opacity: 0;
                transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #boot-splash.boot-leaving .boot-shell {
                opacity: 0;
                transform: scale(1.02);
                transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #boot-splash::after {
                content: '';
                position: absolute;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                background:
                    radial-gradient(58% 42% at 50% 40%, rgba(100,225,243,0.10), transparent 72%),
                    linear-gradient(180deg, rgba(2,6,16,0.55), rgba(2,6,16,0) 30%, rgba(2,6,16,0.78));
            }
            .boot-grid {
                position: absolute;
                inset: -1px;
                z-index: 0;
                pointer-events: none;
                background-image:
                    linear-gradient(rgba(148,197,224,0.055) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148,197,224,0.055) 1px, transparent 1px);
                background-size: 46px 46px;
                -webkit-mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 78%);
                mask-image: radial-gradient(66% 56% at 50% 44%, #000 0%, transparent 78%);
            }
            .boot-grain {
                position: absolute;
                inset: 0;
                z-index: 0;
                opacity: 0.035;
                pointer-events: none;
                background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
                background-size: 3px 3px;
            }
            .boot-shell {
                position: relative;
                z-index: 1;
                width: min(88vw, 420px);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .boot-mark {
                position: relative;
                width: 86px;
                height: 86px;
                margin: 0 0 22px;
                display: grid;
                place-items: center;
                animation: btMarkIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1px solid rgba(216,180,90,0.45);
                box-shadow: 0 0 26px rgba(100,225,243,0.10), inset 0 0 22px rgba(100,225,243,0.06);
            }
            .boot-mark-ring--2 {
                inset: 11px;
                border-style: dashed;
                border-color: rgba(100,225,243,0.38);
                animation: bootSpin 22s linear infinite;
            }
            .boot-mark-diamond {
                width: 26px;
                height: 26px;
                border: 1px solid rgba(216,180,90,0.85);
                transform: rotate(45deg);
                box-shadow: 0 0 18px rgba(216,180,90,0.35);
                animation: btDiamondIn 0.95s 0.26s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-mark-core {
                position: absolute;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #64e1f3;
                box-shadow: 0 0 16px rgba(100,225,243,0.85);
                animation: bootPulse 2.8s 0.5s ease-in-out infinite;
            }
            .boot-kicker {
                margin-bottom: 12px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.34em;
                text-transform: uppercase;
                color: #7fa3bd;
                animation: btRise 0.85s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-brand {
                display: flex;
                align-items: baseline;
                gap: 0.28em;
                line-height: 0.95;
                letter-spacing: -0.02em;
                animation: btRise 1.05s 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-brand-main,
            .boot-brand-accent { font-size: clamp(2rem, 8.5vw, 2.9rem); font-weight: 800; }
            .boot-brand-main { color: #ffffff; }
            .boot-brand-accent { color: #d8b45a; }
            .boot-rule {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: min(76%, 260px);
                margin: 16px 0 14px;
                transform-origin: center;
                animation: btRule 0.95s 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-rule::before,
            .boot-rule::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(216,180,90,0.5));
            }
            .boot-rule::after { background: linear-gradient(90deg, rgba(216,180,90,0.5), transparent); }
            .boot-rule i {
                width: 5px;
                height: 5px;
                transform: rotate(45deg);
                background: #d8b45a;
                opacity: 0.9;
            }
            .boot-tagline {
                margin: 0 0 26px;
                max-width: 30ch;
                font-size: 13px;
                line-height: 1.6;
                color: #a7bdd1;
                text-wrap: balance;
                animation: btRise 0.9s 0.72s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-progress {
                width: 100%;
                height: 2px;
                border-radius: 999px;
                background: rgba(148,197,224,0.16);
                overflow: hidden;
                animation: btRise 0.85s 0.88s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-progress-fill {
                display: block;
                height: 100%;
                width: 8%;
                border-radius: inherit;
                background: linear-gradient(90deg, #d8b45a, #64e1f3);
                background-size: 200% 100%;
                box-shadow: 0 0 12px rgba(100,225,243,0.45);
                animation:
                    btFill 3s 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                    btSheen 2.6s 1.05s linear infinite;
            }
            .boot-status {
                margin-top: 12px;
                font-size: 10.5px;
                font-weight: 600;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: #6d8aa3;
                animation: btRise 0.75s 1.02s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .boot-status strong { color: #9fd9e6; font-weight: 700; }
            .boot-cursor {
                display: inline-block;
                width: 1px;
                height: 1em;
                margin-left: 6px;
                vertical-align: -2px;
                background: #64e1f3;
                animation: bootBlink 1.1s 1.6s steps(2, start) infinite;
            }
            @keyframes btMarkIn {
                from { opacity: 0; transform: scale(0.92) translateY(6px); }
                to { opacity: 1; transform: none; }
            }
            @keyframes btDiamondIn {
                from { opacity: 0; transform: rotate(45deg) scale(0.55); }
                to { opacity: 1; transform: rotate(45deg) scale(1); }
            }
            @keyframes btRise {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: none; }
            }
            @keyframes btRule {
                from { opacity: 0; transform: scaleX(0.18); }
                to { opacity: 1; transform: scaleX(1); }
            }
            @keyframes btFill {
                from { width: 8%; }
                to { width: 92%; }
            }
            @keyframes btSheen {
                from { background-position: 160% 50%; }
                to { background-position: -60% 50%; }
            }
            @keyframes bootSpin { to { transform: rotate(360deg); } }
            @keyframes bootPulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.55; transform: scale(0.82); }
            }
            @keyframes bootBlink { 50% { opacity: 0; } }
            @media (prefers-reduced-motion: reduce) {
                .boot-mark,
                .boot-mark-ring--2,
                .boot-mark-diamond,
                .boot-mark-core,
                .boot-kicker,
                .boot-brand,
                .boot-rule,
                .boot-tagline,
                .boot-progress,
                .boot-status,
                .boot-cursor { animation: none !important; }
                .boot-progress-fill { animation: none !important; width: 70%; }
                #boot-splash.boot-leaving,
                #boot-splash.boot-leaving .boot-shell { transition: none !important; }
            }
        </style>
    </head>
    <body class="body theme theme--light">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
        <div id="boot-splash" role="status" aria-label="Loading TradingHubs">
            <div class="boot-grid" aria-hidden="true"></div>
            <div class="boot-grain" aria-hidden="true"></div>
            <div class="boot-shell">
                <div class="boot-mark" aria-hidden="true">
                    <span class="boot-mark-ring"></span>
                    <span class="boot-mark-ring boot-mark-ring--2"></span>
                    <span class="boot-mark-diamond"></span>
                    <span class="boot-mark-core"></span>
                </div>
                <div class="boot-kicker">Precision Trading Workspace</div>
                <div class="boot-brand" aria-label="TradingHubs">
                    <span class="boot-brand-main">TRADING</span><span class="boot-brand-accent">HUBS</span>
                </div>
                <div class="boot-rule" aria-hidden="true"><i></i></div>
                <p class="boot-tagline">Build, automate and run trading strategies with clarity and confidence.</p>
                <div class="boot-progress" aria-hidden="true"><span class="boot-progress-fill"></span></div>
                <div class="boot-status">Initializing <strong id="bt-boot-status-text">Core</strong><span class="boot-cursor" aria-hidden="true"></span></div>
            </div>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;
                var hidden = false;
                var reduce_motion = false;
                try {
                    reduce_motion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
                } catch (e) {
                    reduce_motion = false;
                }
                var drop = function () {
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                };
                var hide = function () {
                    if (hidden) return;
                    hidden = true;
                    /* Dissolve out (0.45s) instead of vanishing between frames.
                       The class is added here and the node removed on a timer,
                       so the app is already painted underneath as it clears. */
                    if (reduce_motion) {
                        drop();
                        return;
                    }
                    splash.className += ' boot-leaving';
                    setTimeout(drop, 460);
                };
                window.__hideBootSplash = hide;
                var lines = ['Core', 'Trading engines', 'Market data', 'AI workspace', 'Final checks'];
                var idx = 0;
                var el = document.getElementById('bt-boot-status-text');
                if (el) {
                    setInterval(function () {
                        if (hidden) return;
                        idx = (idx + 1) % lines.length;
                        el.textContent = lines[idx];
                    }, 1400);
                }
                setTimeout(hide, 60000);
            })();
        </script>
    </body>
