            (function () {
                // Light is the brand default (SmartFlip-class look); an explicit
                // stored choice always wins.
                var mode = 'light';
                try { mode = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}
                var root = document.documentElement;
                root.dataset.theme = mode;
                root.classList.add(mode);
                root.style.colorScheme = mode;
                // Sync the body class before first paint so the theme tokens apply
                // immediately (body ships as theme--light in the markup below).
                var applyBody = function () {
                    var b = document.body;
                    if (!b) return;
                    b.classList.remove('theme--light', 'theme--dark');
                    b.classList.add('theme--' + mode);
                    var mc = document.querySelector('meta[name="theme-color"]');
                    if (mc) mc.setAttribute('content', mode === 'dark' ? '#050a14' : '#f2f3f4');
                };
                if (document.body) applyBody();
                else document.addEventListener('DOMContentLoaded', applyBody);
            })();

            // JS bundle is being parsed/evaluated, before main.tsx can register
            // its own handlers. Renders directly into #root (no React needed).

            // app is alive and must NEVER be replaced by a full-screen error page.

                        text

                        'border-radius:10px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
                        'color:#0b1220;background:#fff;border:1px solid rgba(15,23,42,.12);' +

        <script>
            // Animated page title — eye-catching single-line text that cycles
            // through compelling variants. Pauses when the tab is hidden.
            (function () {
                var titleEl = document.getElementById('page-title');
                if (!titleEl) return;

                var variants = [
                    'TradingHubs.site — Free Deriv Bots & Smart Trading Automation',
                    '🤖 Load Free Bots • Trade Smarter • TradingHubs.site',
                    '📈 AI Market Scanner • Deriv Trading Workspace',
                    '⚡ Speedbot & Bot Builder • No Code Required'
                ];
                var idx = 0;
                var paused = false;

                document.addEventListener('visibilitychange', function () {
                    paused = document.hidden;
                    if (!paused) cycle();
                });

                function cycle() {
                    if (paused) return;
                    idx = (idx + 1) % variants.length;
                    titleEl.textContent = variants[idx];
                    setTimeout(cycle, 3500);
                }

                setTimeout(cycle, 3000);
            })();

        <script>
            // The pre-hydration splash is removed the instant the React
            // cinematic splash mounts (see BootSplash), so the two full-screen
            // layers never overlap. The 6s failsafe guarantees the app is never
            // trapped behind it, and __showFatalError removes it on a boot crash.
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;
                var hidden = false;
                var hide = function () {
                    if (hidden) return;
                    hidden = true;
                    clearInterval(copyTimer);
                    // Hard cut, not a fade: the React splash is already painted
                    // underneath, so fading would show both layers at once.
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                };
                window.__hideBootSplash = hide;
                // Rotating boot copy (SmartFlip-style loader, richer cadence).
                var lines = [
                    'Warming up the bot engine…',
                    'Preparing your dashboard…',
                    'Loading AI engines…',
                    'Connecting markets…'
                ];
                var idx = 0;
                var el = document.getElementById('boot-splash-status');
                var copyTimer = setInterval(function () {
                    if (!el || hidden) return;
                    idx = (idx + 1) % lines.length;
                    el.className = 'boot-splash__status boot-splash__status--swap';
                    setTimeout(function () {
                        el.textContent = lines[idx];
                        el.className = 'boot-splash__status';
                    }, 350);
                }, 1600);
                setTimeout(hide, 6000);
            })();
        </script>
