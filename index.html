            (function () {
                // Light is the brand default (SmartFlip-class look); an explicit
                // stored choice always wins.
                var mode = 'light';
                try { mode = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}
                var root = document.documentElement;
                root.dataset.theme = mode;
                root.classList.add(mode);
                root.style.colorScheme = mode;
                // Sync the body class before first paint so the theme tokens apply
                // immediately (body ships as theme--light in the markup below).
                var applyBody = function () {
                    var b = document.body;
                    if (!b) return;
                    b.classList.remove('theme--light', 'theme--dark');
                    b.classList.add('theme--' + mode);
                    var mc = document.querySelector('meta[name="theme-color"]');
                    if (mc) mc.setAttribute('content', mode === 'dark' ? '#050a14' : '#f2f3f4');
                };
                if (document.body) applyBody();
                else document.addEventListener('DOMContentLoaded', applyBody);
            })();

                        'color:#0b1220;background:#fff;border:1px solid rgba(15,23,42,.12);' +

        <script>
            // Animated page title — eye-catching single-line text that cycles
            // through compelling variants. Pauses when the tab is hidden.
            (function () {
                var titleEl = document.getElementById('page-title');
                if (!titleEl) return;

                var variants = [
                    'TradingHubs.site — Free Deriv Bots & Smart Trading Automation',
                    '🤖 Load Free Bots • Trade Smarter • TradingHubs.site',
                    '📈 AI Market Scanner • Deriv Trading Workspace',
                    '⚡ Speedbot & Bot Builder • No Code Required'
                ];
                var idx = 0;
                var paused = false;

                document.addEventListener('visibilitychange', function () {
                    paused = document.hidden;
                    if (!paused) cycle();
                });

                function cycle() {
                    if (paused) return;
                    idx = (idx + 1) % variants.length;
                    titleEl.textContent = variants[idx];
                    setTimeout(cycle, 3500);
                }

                setTimeout(cycle, 3000);
            })();
        </script>

                var splash = document.getElementById('boot-splash');
                if (!splash) return;

                var hide = function () {
                    if (hidden) return;
                    hidden = true;
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                };
                window.__hideBootSplash = hide;
                var lines = [

                    'Preparing your dashboard…',

                    'Connecting markets…'

                if (el) {
                    var timer = setInterval(function () {
                        if (hidden) return;
                        idx = (idx + 1) % lines.length;
                        el.textContent = lines[idx];
                    }, 1600);
                }
                setTimeout(hide, 60000);
            })();
