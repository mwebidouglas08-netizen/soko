<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TradingHubs icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="55%" stop-color="#071a2d"/>
      <stop offset="100%" stop-color="#0a2438"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d37a"/>
      <stop offset="45%" stop-color="#d8b45a"/>
      <stop offset="100%" stop-color="#b98a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26dfff"/>
      <stop offset="100%" stop-color="#7ff3ff"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26dfff"/>
      <stop offset="100%" stop-color="#d8b45a"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="none" stroke="url(#gold)" stroke-opacity="0.38" stroke-width="4"/>
  <rect x="38" y="38" width="436" height="436" rx="104" fill="none" stroke="#64e1f3" stroke-opacity="0.12" stroke-width="2"/>
  <ellipse cx="256" cy="210" rx="170" ry="120" fill="#22e7ff" opacity="0.07"/>
  <path d="M92 238h328" stroke="url(#gold)" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M92 292h328" stroke="#64e1f3" stroke-opacity="0.10" stroke-width="2"/>
  <!-- chart mark -->
  <path d="M118 206 L168 170 L214 184 L264 136 L304 154 L356 108 L394 122" fill="none" stroke="url(#chart)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <circle cx="168" cy="170" r="7" fill="#eafcff"/>
  <circle cx="264" cy="136" r="7" fill="#eafcff"/>
  <circle cx="356" cy="108" r="10" fill="#d8b45a"/>
  <circle cx="356" cy="108" r="4" fill="#081426"/>
  <!-- emblem badge -->
  <rect x="156" y="244" width="200" height="92" rx="28" fill="#0b1d31" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="165" y="253" width="182" height="74" rx="22" fill="none" stroke="#64e1f3" stroke-opacity="0.18" stroke-width="2"/>
  <text x="256" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="3" fill="#f4f8ff">TH</text>
  <!-- site name -->
  <text x="256" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="1.2" fill="#f4f8ff">TRADING<tspan fill="#d8b45a">HUBS</tspan></text>
  <text x="256" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#7fd9e8">.SITE</text>
</svg>
