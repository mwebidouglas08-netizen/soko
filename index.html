        <script>
            (function () {
                // Light is the brand default (SmartFlip-class look); an explicit
                // stored choice always wins.
                var mode = 'light';
                try { mode = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}
                var root = document.documentElement;
                root.dataset.theme = mode;
                root.classList.add(mode);
                root.style.colorScheme = mode;
                // Sync the body class before first paint so the theme tokens apply
                // immediately (body ships as theme--light in the markup below).
                var applyBody = function () {
                    var b = document.body;
                    if (!b) return;
                    b.classList.remove('theme--light', 'theme--dark');
                    b.classList.add('theme--' + mode);
                    var mc = document.querySelector('meta[name="theme-color"]');
                    if (mc) mc.setAttribute('content', mode === 'dark' ? '#050a14' : '#f2f3f4');
                };
                if (document.body) applyBody();
                else document.addEventListener('DOMContentLoaded', applyBody);
            })();
        </script>
        <script>
            // Pre-bundle error catcher: catches crashes that happen while the
            // JS bundle is being parsed/evaluated, before main.tsx can register
            // its own handlers. Renders directly into #root (no React needed).
            window.__fatalErrorShown = false;
            // Set by main.tsx once React has committed its first render. Before
            // that a crash really is fatal (nothing is on screen); afterwards the
            // app is alive and must NEVER be replaced by a full-screen error page.
            window.__appMounted = false;
            // Errors raised by browser extensions (MetaMask and other wallet
            // add-ons, ad blockers, password managers) surface on `window` exactly
            // like our own, but say nothing about this app's health. Identify them
            // so they can be logged instead of being mistaken for an app crash.
            window.__isExtensionError = function (err) {
                if (!err) return false;
                var text = '';
                try {
                    text = String((err && (err.stack || err.message)) || err);
                } catch (_) {
                    return false;
                }
                return (
                    /(chrome|moz|safari|safari-web|ms-browser)-extension:\/\//i.test(text) ||
                    /metamask|ethereum|evmask|eth_requestAccounts|wallet_?connect|coinbase|trust ?wallet|phantom/i.test(
                        text
                    )
                );
            };
            window.__showFatalError = function (message) {
                if (window.__fatalErrorShown) return;
                window.__fatalErrorShown = true;
                console.error('[FATAL]', message);
                var splash = document.getElementById('boot-splash');
                if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                var el = document.getElementById('root');
                if (!el) return;
                el.innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#050a14;color:#fff;font-family:sans-serif;flex-direction:column;gap:16px;padding:24px;text-align:center">' +
                    '<p style="font-size:18px;font-weight:600">Something went wrong</p>' +
                    '<p style="font-size:14px;color:#aaa;max-width:600px;word-break:break-word">' +
                    String(message).replace(/</g, '&lt;') +
                    '</p>' +
                    '<button onclick="location.reload()" style="padding:8px 24px;border-radius:4px;border:none;background:#0e9aa7;color:#fff;cursor:pointer;font-size:14px">Refresh</button>' +
                    '</div>';
            };
            // Non-blocking, dismissible notice for recoverable runtime problems.
            // A wallet-extension rejection gets a small dismissible card in the
            // corner - never a full-screen "Something went wrong" page.
            window.__showNonFatalNotice = function (message) {
                try {
                    var text = String(message == null ? 'Something went wrong' : message).slice(0, 240);
                    var stack = document.getElementById('app-notice-stack');
                    if (!stack) {
                        stack = document.createElement('div');
                        stack.id = 'app-notice-stack';
                        stack.setAttribute('role', 'status');
                        stack.setAttribute('aria-live', 'polite');
                        stack.style.cssText =
                            'position:fixed;right:14px;bottom:14px;z-index:2147482000;display:flex;' +
                            'flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 28px));pointer-events:none;';
                        (document.body || document.documentElement).appendChild(stack);
                    }
                    // Collapse repeats so a retrying extension cannot spam the page.
                    var key = text.replace(/[\\"']/g, '');
                    if (stack.querySelector('[data-notice="' + key + '"]')) return;
                    var card = document.createElement('div');
                    card.setAttribute('data-notice', key);
                    card.style.cssText =
                        'pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;' +
                        'border-radius:10px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
                        'color:#0b1220;background:#fff;border:1px solid rgba(15,23,42,.12);' +
                        'box-shadow:0 10px 30px rgba(15,23,42,.16);';
                    var body = document.createElement('span');
                    body.style.cssText = 'flex:1;word-break:break-word;';
                    body.textContent = text;
                    var close = document.createElement('button');
                    close.type = 'button';
                    close.textContent = '\u00d7';
                    close.setAttribute('aria-label', 'Dismiss');
                    close.style.cssText =
                        'border:0;background:transparent;color:#5b6472;font-size:16px;line-height:1;' +
                        'cursor:pointer;padding:0 2px;';
                    close.onclick = function () {
                        if (card.parentNode) card.parentNode.removeChild(card);
                    };
                    card.appendChild(body);
                    card.appendChild(close);
                    stack.appendChild(card);
                    setTimeout(function () {
                        if (card.parentNode) card.parentNode.removeChild(card);
                    }, 9000);
                } catch (_) {}

            // rendered yet. Once mounted, report non-fatally and keep going.

                    console.warn('[ignored extension error]', label, err);

                }

                }

            };

                'error',

                    // be fatal - only a missing entry bundle leaves nothing to draw.

                window.__reportError(e.reason, 'unhandledrejection');

            // module throws before any handler fires), detect the blank state.

                }

        <script>
            // Animated page title — eye-catching single-line text that cycles
            // through compelling variants. Pauses when the tab is hidden.
            (function () {
                var titleEl = document.getElementById('page-title');
                if (!titleEl) return;

                var variants = [
                    'TradingHubs.site — Free Deriv Bots & Smart Trading Automation',
                    '🤖 Load Free Bots • Trade Smarter • TradingHubs.site',
                    '📈 AI Market Scanner • Deriv Trading Workspace',
                    '⚡ Speedbot & Bot Builder • No Code Required'
                ];
                var idx = 0;
                var paused = false;

                document.addEventListener('visibilitychange', function () {
                    paused = document.hidden;
                    if (!paused) cycle();
                });

                function cycle() {
                    if (paused) return;
                    idx = (idx + 1) % variants.length;
                    titleEl.textContent = variants[idx];
                    setTimeout(cycle, 3500);
                }

                setTimeout(cycle, 3000);
            })();
        </script>

        <script>
            // The pre-hydration splash is removed the instant the React
            // cinematic splash mounts (see BootSplash), so the two full-screen
            // layers never overlap. The 6s failsafe guarantees the app is never
            // trapped behind it, and __showFatalError removes it on a boot crash.
            (function () {
                var splash = document.getElementById('boot-splash');
                if (!splash) return;
                var hidden = false;
                var hide = function () {
                    if (hidden) return;
                    hidden = true;
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                };
                window.__hideBootSplash = hide;
                var lines = [
                    'Warming up the bot engine…',
                    'Preparing your dashboard…',
                    'Loading AI engines…',
                    'Connecting markets…'
                ];
                var idx = 0;
                var el = document.querySelector('.bt-status-row strong');
                if (el) {
                    var timer = setInterval(function () {
                        if (hidden) return;
                        idx = (idx + 1) % lines.length;
                        el.textContent = lines[idx];
                    }, 1600);
                }
                setTimeout(hide, 6000);
            })();
        </script>
